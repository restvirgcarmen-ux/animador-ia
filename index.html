<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Animador IA</title><link rel="stylesheet" href="style.css"></head><body><main><h1>🎙️ ANIMADOR <span>IA</span></h1><p>Crea anuncios con voz de animador</p><section><label>¿Qué quieres anunciar?</label><textarea id="brief" rows="6"></textarea><div class="grid"><div><label>🎤 Estilo</label><select id="style"><option value="animador">Animador alegre</option><option value="fiesta">Fiesta / explosivo</option><option value="comercial">Locutor comercial</option><option value="orquesta">Presentación de orquesta</option></select></div><div><label>⚡ Energía</label><select id="energy"><option>Suave</option><option selected>Media</option><option>Explosiva</option></select></div></div><button id="generate">✨ GENERAR TEXTO</button></section><section><h2>📝 Guion</h2><textarea id="script" rows="9"></textarea><button id="speak">🔊 ESCUCHAR</button> <button id="stop">⏹ DETENER</button><button id="copy">Copiar</button></section><section><h2>🎙️ Mis voces personalizadas</h2><p>Las muestras de esta versión se guardan localmente en este navegador.</p><div id="voices"></div><button id="addVoice">＋ AGREGAR NUEVA VOZ</button><div id="recorder" hidden><h3>Nueva muestra</h3><input id="voiceName" placeholder="Nombre de la voz"><div class="consent-row"><input id="consent" type="checkbox"><span>Confirmo que tengo autorización del titular de esta voz.</span></div><button id="record">🎙️ GRABAR MUESTRA</button><button id="cancel">Cancelar</button><p id="status">Listo</p></div></section><section><h2>🎚️ Voz</h2><label>Velocidad <input id="rate" type="range" min=".7" max="1.35" step=".05" value="1"></label><label>Tono <input id="pitch" type="range" min=".6" max="1.4" step=".05" value=".9"></label></section></main><script src="script.js"></script></body></html>
